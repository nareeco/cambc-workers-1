name: Sealed controller
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Opaque release identity
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: sealed-controller
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography==42.0.8
      - run: python -B -m unittest -q test_worker
      - name: Run sealed workload
        env:
          GH_TOKEN: ${{ github.token }}
          BOX_KEY: ${{ secrets.BOX_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: python -B worker.py --repo "$REPO" --tag "$TAG" --shard 0 --out "$RUNNER_TEMP/sealed-work" --transport both
      - name: Return sealed index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: index-${{ inputs.tag }}-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-work/export-index/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Return sealed details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-${{ inputs.tag }}-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-work/export-full/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
